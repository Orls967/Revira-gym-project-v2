Id:
  name: id
  in: path
  required: true
  description: ID data.
  schema:
    type: integer
    minimum: 1
Page:
  name: page
  in: query
  required: false
  description: Nomor halaman (paginasi Laravel).
  schema:
    type: integer
    minimum: 1
    default: 1
PerPage:
  name: per_page
  in: query
  required: false
  description: Jumlah data per halaman. Default mengikuti `paginate()` Laravel (15).
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 15
Search:
  name: search
  in: query
  required: false
  description: Cari berdasarkan nama (mengandung teks).
  schema:
    type: string
    maxLength: 100
IsActiveFilter:
  name: is_active
  in: query
  required: false
  description: Filter status aktif.
  schema:
    type: boolean
DateFrom:
  name: date_from
  in: query
  required: false
  description: Tanggal awal (`YYYY-MM-DD`), inklusif.
  schema:
    type: string
    format: date
DateTo:
  name: date_to
  in: query
  required: false
  description: Tanggal akhir (`YYYY-MM-DD`), inklusif.
  schema:
    type: string
    format: date
ClassIdFilter:
  name: class_id
  in: query
  required: false
  description: Filter berdasarkan ID kelas.
  schema:
    type: integer
    minimum: 1
ScheduleStatusFilter:
  name: status
  in: query
  required: false
  description: Filter status jadwal.
  schema:
    $ref: ./schemas.yaml#/ScheduleStatus
UpdatedSince:
  name: updated_since
  in: query
  required: false
  description: Hanya jadwal yang `updated_at`-nya setelah waktu ini (ISO 8601 dengan offset).
  schema:
    type: string
    format: date-time
TransactionId:
  name: transaction
  in: path
  required: true
  description: ID transaksi.
  schema:
    type: integer
    minimum: 1
