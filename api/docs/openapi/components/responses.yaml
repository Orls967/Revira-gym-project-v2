Unauthorized:
  description: Token tidak ada, tidak valid, atau sudah dicabut.
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        message: Unauthenticated.
Forbidden:
  description: Peran pengguna tidak diizinkan (mis. member mengakses route admin).
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        message: Anda tidak memiliki akses ke sumber daya ini.
NotFound:
  description: Data tidak ditemukan. Beberapa endpoint memakai pesan khusus (mis. receipt). Frontend sebaiknya bergantung pada status code, bukan teks message.
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        message: Data tidak ditemukan.
Conflict:
  description: Data masih dipakai data lain sehingga tidak bisa dihapus.
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        message: Data tidak dapat dihapus karena masih dipakai.
ValidationError:
  description: Validasi gagal.
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        message: The name field is required.
        errors:
          name:
            - The name field is required.
TooManyRequests:
  description: Terlalu banyak percobaan (rate limit).
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      example:
        message: Too Many Attempts.
OperationalHourValidationError:
  description: Validasi jam operasional gagal (SCRUM-51).
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      examples:
        empty:
          summary: Body kosong
          value:
            message: The day of week field is required. (and 3 more errors)
            errors:
              day_of_week:
                - The day of week field is required.
              is_closed:
                - The is closed field is required.
              open_time:
                - Jam buka wajib diisi bila hari tidak libur.
              close_time:
                - Jam tutup wajib diisi bila hari tidak libur.
        duplicateDay:
          summary: Hari sudah punya jam operasional
          value:
            message: Jam operasional untuk hari ini sudah ada.
            errors:
              day_of_week:
                - Jam operasional untuk hari ini sudah ada.
        closeBeforeOpen:
          summary: Jam tutup tidak setelah jam buka
          value:
            message: Jam tutup harus setelah jam buka.
            errors:
              close_time:
                - Jam tutup harus setelah jam buka.
        openWithoutHours:
          summary: Tidak libur tetapi jam kosong
          value:
            message: Jam buka wajib diisi bila hari tidak libur. (and 1 more error)
            errors:
              open_time:
                - Jam buka wajib diisi bila hari tidak libur.
              close_time:
                - Jam tutup wajib diisi bila hari tidak libur.
        invalidFormat:
          summary: Hari tidak dikenal dan format jam salah
          value:
            message: 'Hari harus salah satu dari: Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu. (and 2 more errors)'
            errors:
              day_of_week:
                - 'Hari harus salah satu dari: Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu.'
              open_time:
                - Jam buka harus berformat HH:MM.
              close_time:
                - Jam tutup harus berformat HH:MM.
GymClassValidationError:
  description: Validasi kelas gagal (SCRUM-52).
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      examples:
        empty:
          summary: Body kosong
          value:
            message: The name field is required. (and 1 more error)
            errors:
              name:
                - The name field is required.
              min_participants:
                - The min participants field is required.
        minParticipantsZero:
          summary: min_participants 0 atau negatif
          value:
            message: Jumlah peserta minimum harus minimal 1.
            errors:
              min_participants:
                - Jumlah peserta minimum harus minimal 1.
        minParticipantsTooLarge:
          summary: min_participants lebih dari 1000
          value:
            message: Jumlah peserta minimum tidak boleh lebih dari 1000.
            errors:
              min_participants:
                - Jumlah peserta minimum tidak boleh lebih dari 1000.
        minParticipantsNotInteger:
          summary: min_participants pecahan atau bukan angka
          value:
            message: The min participants field must be an integer.
            errors:
              min_participants:
                - The min participants field must be an integer.
        instructorNotFound:
          summary: Instruktur tidak ada atau nonaktif
          value:
            message: Instruktur tidak ditemukan atau tidak aktif.
            errors:
              default_instructor_id:
                - Instruktur tidak ditemukan atau tidak aktif.
InstructorValidationError:
  description: Validasi instruktur gagal (SCRUM-54).
  content:
    application/json:
      schema:
        $ref: ./schemas.yaml#/Error
      examples:
        nameRequired:
          summary: Nama kosong
          value:
            message: Nama instruktur wajib diisi.
            errors:
              name:
                - Nama instruktur wajib diisi.
        nameTooLong:
          summary: Nama lebih dari 100 karakter
          value:
            message: Nama instruktur maksimal 100 karakter.
            errors:
              name:
                - Nama instruktur maksimal 100 karakter.
        phoneInvalid:
          summary: Nomor HP bukan nomor Indonesia
          value:
            message: Nomor HP harus nomor Indonesia yang diawali 08, +62, atau 62.
            errors:
              phone_number:
                - Nomor HP harus nomor Indonesia yang diawali 08, +62, atau 62.
