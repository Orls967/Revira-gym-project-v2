adminTransactions:
  get:
    operationId: getAdminTransactions
    tags: [Transaksi]
    summary: Daftar transaksi berdasarkan status verifikasi
    description: |
      Menampilkan daftar transaksi membership yang difilter berdasarkan status verifikasi (default `pending`; nilai kosong `?status=` diperlakukan sebagai `pending`).
      Hanya untuk peran admin. Hasil diurutkan berdasarkan aturan:
      - `pending`: transaksi terlama di atas (`created_at` asc, `id` asc).
      - `verified` dan `rejected`: transaksi terbaru di atas (`created_at` desc, `id` desc).
      Paginasi tetap 15 data per halaman.
    parameters:
      - name: status
        in: query
        required: false
        description: Status verifikasi transaksi. Default `pending`. Nilai kosong (`?status=`) diperlakukan sebagai `pending`.
        schema:
          type: string
          enum: [pending, verified, rejected]
          default: pending
      - $ref: ../components/parameters.yaml#/Page
    responses:
      '200':
        description: Daftar transaksi berhasil diambil dengan format paginasi Laravel.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminTransactionListResponse
            examples:
              pendingList:
                summary: Contoh daftar transaksi pending (berisi transfer dan on_the_spot)
                value:
                  data:
                    - id: 2
                      member:
                        id: 3
                        name: Siti Rahmah
                        email: member2@revira.test
                        phone_number: '081234567891'
                      plan:
                        id: 1
                        name: 1 Bulan Reguler
                        duration_days: 30
                      record_type: registration
                      start_date: '2026-10-20'
                      amount: 150000
                      payment_method: transfer
                      verification_status: pending
                      has_receipt: true
                      receipt_url: /api/v1/transactions/2/receipt
                      reject_reason: null
                      verified_at: null
                      created_at: '2026-10-18T09:00:00+08:00'
                    - id: 3
                      member:
                        id: 4
                        name: Ahmad Fauzi
                        email: member3@revira.test
                        phone_number: '081234567892'
                      plan:
                        id: 2
                        name: 3 Bulan Reguler
                        duration_days: 90
                      record_type: registration
                      start_date: '2026-10-21'
                      amount: 400000
                      payment_method: on_the_spot
                      verification_status: pending
                      has_receipt: false
                      receipt_url: null
                      reject_reason: null
                      verified_at: null
                      created_at: '2026-10-18T10:30:00+08:00'
                  links:
                    first: http://localhost:8000/api/v1/admin/transactions?page=1
                    last: http://localhost:8000/api/v1/admin/transactions?page=1
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      - url: null
                        label: '&laquo; Sebelumnya'
                        active: false
                      - url: http://localhost:8000/api/v1/admin/transactions?page=1
                        label: '1'
                        active: true
                      - url: null
                        label: 'Berikutnya &raquo;'
                        active: false
                    path: http://localhost:8000/api/v1/admin/transactions
                    per_page: 15
                    to: 2
                    total: 2
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '422':
        $ref: ../components/responses.yaml#/TransactionValidationError
