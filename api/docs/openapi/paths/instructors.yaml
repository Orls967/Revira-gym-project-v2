adminInstructors:
  get:
    operationId: listInstructors
    tags: [Instructors]
    summary: Daftar instruktur (admin)
    description: |
      SCRUM-54. Role admin. Paginasi, filter `is_active`, cari nama. Terurut berdasarkan `id`.
      Pencarian `search` tidak peka huruf besar/kecil; `%` dan `_` dicari apa adanya, bukan wildcard.
      `is_active` menerima `true`/`false` maupun `1`/`0`; tanpa parameter ini instruktur aktif dan nonaktif sama-sama tampil.
      Link paginasi membawa query filter yang dikirim.
    parameters:
      - $ref: ../components/parameters.yaml#/IsActiveFilter
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PerPage
    responses:
      '200':
        description: Halaman instruktur.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InstructorPage
            example:
              data:
                - id: 1
                  name: Budi Santoso
                  specialization: Yoga
                  phone_number: '081234567890'
                  is_active: true
                  created_at: '2026-10-10T08:00:00+08:00'
                  updated_at: '2026-10-10T08:00:00+08:00'
              links:
                first: http://localhost:8000/api/v1/admin/instructors?search=budi&page=1
                last: http://localhost:8000/api/v1/admin/instructors?search=budi&page=1
                prev: null
                next: null
              meta:
                current_page: 1
                from: 1
                last_page: 1
                links:
                  - url: null
                    label: '&laquo; Previous'
                    active: false
                  - url: http://localhost:8000/api/v1/admin/instructors?search=budi&page=1
                    label: '1'
                    active: true
                  - url: null
                    label: Next &raquo;
                    active: false
                path: http://localhost:8000/api/v1/admin/instructors
                per_page: 15
                to: 1
                total: 1
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '422':
        description: Query string tidak valid (`is_active` bukan boolean, `page` < 1, `per_page` di luar 1-100, `search` > 100 karakter).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              message: Filter is_active harus bernilai true, false, 1, atau 0.
              errors:
                is_active:
                  - Filter is_active harus bernilai true, false, 1, atau 0.
  post:
    operationId: createInstructor
    tags: [Instructors]
    summary: Buat instruktur (admin)
    description: |
      SCRUM-54. Role admin. Hanya `name` yang wajib. `is_active` default true.
      `phone_number` boleh null; bila diisi harus nomor Indonesia. Format `+62`/`62`, spasi, dan tanda hubung diterima lalu disimpan sebagai `08xxx`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/InstructorInput
          example:
            name: Budi Santoso
            specialization: Yoga
            phone_number: '081234567890'
            is_active: true
    responses:
      '201':
        description: Dibuat.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InstructorMutationResponse
            example:
              message: Instruktur berhasil dibuat.
              data:
                id: 4
                name: Budi Santoso
                specialization: Yoga
                phone_number: '081234567890'
                is_active: true
                created_at: '2026-10-10T08:00:00+08:00'
                updated_at: '2026-10-10T08:00:00+08:00'
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '422':
        $ref: ../components/responses.yaml#/InstructorValidationError
adminInstructorById:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    operationId: getInstructor
    tags: [Instructors]
    summary: Detail instruktur (admin)
    description: SCRUM-54. Role admin.
    responses:
      '200':
        description: Detail instruktur.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InstructorResponse
            example:
              data:
                id: 4
                name: Budi Santoso
                specialization: Yoga
                phone_number: '081234567890'
                is_active: true
                created_at: '2026-10-10T08:00:00+08:00'
                updated_at: '2026-10-10T08:00:00+08:00'
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    operationId: updateInstructor
    tags: [Instructors]
    summary: Ubah instruktur (admin)
    description: |
      SCRUM-54. Role admin. Aturan validasi sama dengan POST. Bila `is_active` tidak dikirim, status aktif tidak berubah.
      Menonaktifkan instruktur (`is_active` dari true ke false) ditolak 409 selama masih ada jadwal mendatang
      (`schedule_date` hari ini atau setelahnya dengan status `scheduled`/`ongoing`); pindahkan atau batalkan jadwalnya lebih dulu.
      Instruktur yang sudah nonaktif tetap bisa diubah.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/InstructorInput
          example:
            name: Budi Santoso
            specialization: Yoga
            phone_number: '081234567890'
            is_active: false
    responses:
      '200':
        description: Diubah.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InstructorMutationResponse
            example:
              message: Instruktur berhasil diperbarui.
              data:
                id: 4
                name: Budi Santoso
                specialization: Yoga
                phone_number: '081234567890'
                is_active: false
                created_at: '2026-10-10T08:00:00+08:00'
                updated_at: '2026-10-12T09:30:00+08:00'
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Instruktur masih memiliki jadwal mendatang sehingga tidak dapat dinonaktifkan.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              message: Instruktur tidak dapat dinonaktifkan karena masih memiliki jadwal mendatang. Silakan pindahkan jadwal ke instruktur lain atau batalkan jadwal tersebut lebih dulu.
      '422':
        $ref: ../components/responses.yaml#/InstructorValidationError
  delete:
    operationId: deleteInstructor
    tags: [Instructors]
    summary: Hapus instruktur (admin)
    description: |
      SCRUM-54. Role admin. Hanya untuk instruktur yang belum pernah dipakai.
      Instruktur yang punya jadwal (termasuk jadwal yang dibatalkan) atau masih menjadi instruktur default kelas → 409; nonaktifkan dengan is_active=false.
    responses:
      '200':
        description: Dihapus.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/MessageResponse
            example:
              message: Instruktur berhasil dihapus.
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Instruktur sudah memiliki jadwal atau masih menjadi instruktur default kelas.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            examples:
              hasSchedules:
                summary: Sudah memiliki jadwal
                value:
                  message: Instruktur tidak dapat dihapus karena sudah memiliki jadwal. Silakan pindahkan jadwal ke instruktur lain lebih dulu, atau nonaktifkan instruktur (is_active = false) sebagai alternatif.
              defaultInstructor:
                summary: Masih menjadi instruktur default kelas
                value:
                  message: Instruktur tidak dapat dihapus karena masih menjadi instruktur default kelas. Silakan ganti instruktur default kelas tersebut lebih dulu, atau nonaktifkan instruktur (is_active = false) sebagai alternatif.
