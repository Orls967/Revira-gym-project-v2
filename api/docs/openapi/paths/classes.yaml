adminClasses:
  get:
    operationId: listClasses
    tags: [Classes]
    summary: Daftar kelas (admin)
    description: |
      SCRUM-52. Role admin. Paginasi, filter `is_active`, cari nama. Terurut berdasarkan `id`.
      Pencarian `search` tidak peka huruf besar/kecil; `%` dan `_` dicari apa adanya, bukan wildcard.
      `is_active` menerima `true`/`false` maupun `1`/`0`; tanpa parameter ini kelas aktif dan nonaktif sama-sama tampil.
      Link paginasi membawa query filter yang dikirim.
    parameters:
      - $ref: ../components/parameters.yaml#/IsActiveFilter
      - $ref: ../components/parameters.yaml#/Search
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PerPage
    responses:
      '200':
        description: Halaman kelas.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/GymClassPage
            example:
              data:
                - id: 1
                  name: Yoga Morning Flow
                  description: Sesi peregangan dan meditasi pagi untuk kelenturan dan ketenangan mental.
                  min_participants: 3
                  default_instructor_id: 3
                  is_active: true
                  created_at: '2026-10-10T08:00:00+08:00'
                  updated_at: '2026-10-10T08:00:00+08:00'
              links:
                first: http://localhost:8000/api/v1/admin/classes?is_active=true&page=1
                last: http://localhost:8000/api/v1/admin/classes?is_active=true&page=1
                prev: null
                next: null
              meta:
                current_page: 1
                from: 1
                last_page: 1
                links:
                  - url: null
                    label: '&laquo; Previous'
                    active: false
                  - url: http://localhost:8000/api/v1/admin/classes?is_active=true&page=1
                    label: '1'
                    active: true
                  - url: null
                    label: Next &raquo;
                    active: false
                path: http://localhost:8000/api/v1/admin/classes
                per_page: 15
                to: 1
                total: 1
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '422':
        description: Query string tidak valid (`is_active` bukan boolean, `page` < 1, `per_page` di luar 1-100, `search` > 100 karakter).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              message: Filter is_active harus bernilai true, false, 1, atau 0. (and 2 more errors)
              errors:
                is_active:
                  - Filter is_active harus bernilai true, false, 1, atau 0.
                page:
                  - The page field must be at least 1.
                per_page:
                  - The per page field must be an integer.
  post:
    operationId: createClass
    tags: [Classes]
    summary: Buat kelas (admin)
    description: |
      SCRUM-52. `min_participants` bilangan bulat 1-1000. Tanpa kapasitas maksimum; field lain yang tidak dikenal diabaikan.
      `is_active` default true. `default_instructor_id` boleh null, bila diisi harus ID instruktur yang ada.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/GymClassInput
          example:
            name: Yoga Pagi
            description: Yoga untuk pemula
            min_participants: 3
            default_instructor_id: 1
            is_active: true
    responses:
      '201':
        description: Dibuat.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/GymClassMutationResponse
            example:
              message: Kelas berhasil dibuat.
              data:
                id: 4
                name: Yoga Pagi
                description: Yoga untuk pemula
                min_participants: 3
                default_instructor_id: 1
                is_active: true
                created_at: '2026-10-10T08:00:00+08:00'
                updated_at: '2026-10-10T08:00:00+08:00'
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '422':
        $ref: ../components/responses.yaml#/GymClassValidationError
adminClassById:
  parameters:
    - $ref: ../components/parameters.yaml#/Id
  get:
    operationId: getClass
    tags: [Classes]
    summary: Detail kelas (admin)
    description: SCRUM-52. Role admin.
    responses:
      '200':
        description: Detail kelas.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/GymClassResponse
            example:
              data:
                id: 4
                name: Yoga Pagi
                description: Yoga untuk pemula
                min_participants: 3
                default_instructor_id: 1
                is_active: true
                created_at: '2026-10-10T08:00:00+08:00'
                updated_at: '2026-10-10T08:00:00+08:00'
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  put:
    operationId: updateClass
    tags: [Classes]
    summary: Ubah kelas (admin)
    description: SCRUM-52. Role admin. Aturan validasi sama dengan POST. Bila `is_active` tidak dikirim, status aktif tidak berubah.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/GymClassInput
          example:
            name: Yoga Pagi
            description: Yoga untuk pemula
            min_participants: 3
            default_instructor_id: 1
            is_active: false
    responses:
      '200':
        description: Diubah.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/GymClassMutationResponse
            example:
              message: Kelas berhasil diperbarui.
              data:
                id: 4
                name: Yoga Pagi
                description: Yoga untuk pemula
                min_participants: 3
                default_instructor_id: 1
                is_active: false
                created_at: '2026-10-10T08:00:00+08:00'
                updated_at: '2026-10-12T09:30:00+08:00'
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/GymClassValidationError
  delete:
    operationId: deleteClass
    tags: [Classes]
    summary: Hapus kelas (admin)
    description: SCRUM-52. Role admin. Hanya untuk kelas yang belum punya jadwal (termasuk jadwal yang dibatalkan). Bila sudah punya jadwal → 409; nonaktifkan dengan is_active=false.
    responses:
      '200':
        description: Dihapus.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/MessageResponse
            example:
              message: Kelas berhasil dihapus.
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Kelas sudah memiliki jadwal.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
            example:
              message: Kelas tidak dapat dihapus karena sudah memiliki jadwal. Silakan nonaktifkan kelas (is_active = false) sebagai alternatif.
