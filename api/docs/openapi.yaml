    description: Registrasi, login, dan logout.
  - name: Me
    description: Profil pengguna yang sedang login.
  - name: Diagnostics
    description: Health check dan route uji middleware.
  - name: Membership Plans
    description: Paket membership.
  - name: Public
    description: Data publik tanpa autentikasi.
  - name: Operational Hours
    description: Jam operasional gym (admin).
  - name: Classes
    description: Kelas gym (admin).
  - name: Instructors
    description: Instruktur (admin).
  - name: Schedules
    description: Jadwal kelas.
  - name: Receipts
    description: Bukti transfer.
  - name: Sprint 2
    description: Endpoint yang belum diimplementasikan (`x-status` planned).
