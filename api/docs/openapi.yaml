openapi: 3.1.0
info:
  title: Revira Gym BJM API
  version: 1.0.0
  summary: Kontrak API untuk aplikasi mobile member dan Admin Web.
  description: |
    Kontrak REST API Revira Gym BJM. Semua endpoint berada di bawah prefix `/api/v1`.

    **Status endpoint**
    - Tanpa `x-status`: sudah ada di kode dan didokumentasikan sesuai kode dan tes.
    - `x-status: planned` + tag `Sprint 2`: belum diimplementasikan, field mengikuti migration.

    **Konvensi format respons** (berlaku untuk SCRUM-51, SCRUM-52, SCRUM-54, SCRUM-55, SCRUM-56, SCRUM-93)
    - Respons wajib lewat API Resource; jangan me-return model Eloquent langsung.
    - Datetime: ISO 8601 dengan offset `+08:00` (contoh `2026-10-12T07:00:00+08:00`; di Resource: `->toIso8601String()`), BUKAN default Eloquent UTC (`.000000Z`).
    - Kolom date (`schedule_date`, `start_date`, `end_date`): string `Y-m-d` (`->format('Y-m-d')`), jangan diserialisasi sebagai datetime karena bisa mundur satu hari.
    - Kolom time (`open_time`, `close_time`, `start_time`, `end_time`): `HH:MM` (5 karakter).
    - Uang (`price`, `amount`): integer rupiah (`(int)` di Resource) walau kolom DB decimal.

    **Konvensi umum**
    - Autentikasi: Bearer token Sanctum (`Authorization: Bearer <token>`), didapat dari `POST /login` atau `POST /register`.
    - Error: `{ "message": string, "errors"?: { "field": [string] } }` untuk 401, 403, 404, 409, 422, 429.
    - Paginasi mengikuti format `paginate()` Laravel: `data`, `links`, `meta`.
    - Tanggal-waktu ISO 8601 dengan offset `+08:00` (zona waktu aplikasi Asia/Makassar). Tanggal `YYYY-MM-DD`. Jam `HH:MM`.
    - Kirim header `Accept: application/json` pada setiap request.
  contact:
    name: Tim Backend Revira Gym
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000/api/v1
    description: Lokal
  - url: https://revira-gym-project-production.up.railway.app/api/v1
    description: Staging (Railway)
security:
