# Nixpacks configuration for Revira Gym API
# Pin PHP ke versi 8.5.x sesuai composer.json dan environment lokal tim
providers = ["php"]

[variables]
NIXPACKS_PHP_VERSION = "8.5"

[phases.setup]
nixPkgs = ["...", "php85", "php85Packages.composer"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
