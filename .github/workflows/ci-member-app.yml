name: Member App CI

on:
  workflow_call:

jobs:
  typecheck:
    name: Typecheck & Lint (Member App)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: member-app/.nvmrc
          cache: 'npm'
          cache-dependency-path: member-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint
