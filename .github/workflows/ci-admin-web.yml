name: Admin Web CI

on:
  workflow_call:

jobs:
  lint-and-build:
    name: Lint & Build (Admin Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: admin-web/.nvmrc
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run build (typecheck & bundle)
        run: npm run build
